name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Check formatting
        run: dotnet fantomas --check src tests tools

      - name: Checks
        run: pwsh tools/tests.ps1

      - name: A table over the wire
        run: |
          pwsh tools/wire.ps1
          pwsh tools/wire.ps1 -Game tictactoe

      - name: Replay the committed records
        run: |
          echo quit | dotnet run --no-build -- replay logs/2026-08-03-193909-2p-seed639214079490240407.log | head -2
          echo quit | dotnet run --no-build -- tictactoe replay logs/2026-08-07-190000-2p-noughts.log | head -2

  image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        game: [Turncoats, TicTacToe]

    steps:
      - uses: actions/checkout@v4

      - name: Build the image and play a game in it
        run: pwsh tools/image.ps1 -Game ${{ matrix.game }}
