name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore PrototypingGameEngine.slnx

      - name: Build
        run: dotnet build PrototypingGameEngine.slnx --no-restore -warnaserror

      - name: Check formatting
        run: dotnet fantomas --check src tests tools templates

      - name: Checks
        run: pwsh tools/tests.ps1

      - name: A game out of the template
        run: pwsh tools/template.ps1

      - name: A table over the wire
        run: |
          pwsh tools/wire.ps1
          pwsh tools/wire.ps1 -Game tictactoe
          pwsh tools/wire.ps1 -Game compile
          pwsh tools/wire.ps1 -Game warband

      - name: Replay every committed record
        run: pwsh tools/records.ps1

      - name: The engine as a package, and a game outside the repository built on it
        run: pwsh tools/package.ps1

  # The browser. Windows because tools/smoke.ps1 clears up after itself through Win32_Process,
  # and because Edge is on the runner; until this job existed the only thing driving a real page
  # was somebody typing the command.
  browser:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: A game played in a browser
        run: |
          pwsh tools/smoke.ps1
          pwsh tools/smoke.ps1 -Game compile

  image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        game: [Turncoats, TicTacToe, Diplomacy, Compile, Life, Snake, Cascade, Warband]

    steps:
      - uses: actions/checkout@v4

      - name: Build the image and play a game in it
        run: pwsh tools/image.ps1 -Game ${{ matrix.game }}

  # What a game in a repository of its own builds on. Every push to main is handed out as a release
  # holding the four packages and the two scripts a game's suite loads beside them, so a game takes
  # a newer engine from here - one download, on any machine - rather than from whichever machine
  # last packed one.
  #
  # The number is this file's doing. Directory.Build.props says the first two parts and the run
  # number is the third, so no two pushes hand out the same version: NuGet keeps what it has
  # restored by name and number, and would give back the older of two engines that shared one.
  #
  # It does not wait for the jobs above. A game that takes a release holds it to Conforms.fsx in its
  # own suite, and an engine that does not build does not pack.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack the four under a number of their own
        run: |
          series=$(grep -oP '(?<=<PrototypingVersion>)\d+\.\d+' Directory.Build.props)
          version="$series.${{ github.run_number }}"

          for project in \
            src/Prototyping.Engine.fsproj \
            src/Table/Prototyping.Table.fsproj \
            src/Net/Prototyping.Net.fsproj \
            src/Play/Prototyping.Play.fsproj
          do
            dotnet pack "$project" -c Release -o release -p:PrototypingVersion="$version"
          done

          echo "version=$version" >> "$GITHUB_ENV"

      - name: Hand them out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$version" \
            release/*.nupkg tests/Checks.fsx tests/Conforms.fsx \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes "The engine as of ${GITHUB_SHA::7}: the four packages, and the two scripts a game's suite loads beside them."
