name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Check formatting
        run: dotnet fantomas --check src tests tools templates

      - name: Checks
        run: pwsh tools/tests.ps1

      - name: A game out of the template
        run: pwsh tools/template.ps1

      - name: A table over the wire
        run: |
          pwsh tools/wire.ps1
          pwsh tools/wire.ps1 -Game tictactoe
          pwsh tools/wire.ps1 -Game compile
          pwsh tools/wire.ps1 -Game warband

      - name: Replay every committed record
        run: pwsh tools/records.ps1

      - name: The engine as a package, and a game outside the repository built on it
        run: pwsh tools/package.ps1

  # The browser. Windows because tools/smoke.ps1 clears up after itself through Win32_Process,
  # and because Edge is on the runner; until this job existed the only thing driving a real page
  # was somebody typing the command.
  browser:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: A game played in a browser
        run: |
          pwsh tools/smoke.ps1
          pwsh tools/smoke.ps1 -Game compile

  image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        game: [Turncoats, TicTacToe, Diplomacy, Compile, Life, Snake, Cascade, Warband]

    steps:
      - uses: actions/checkout@v4

      - name: Build the image and play a game in it
        run: pwsh tools/image.ps1 -Game ${{ matrix.game }}
