name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tool manifest pins Fantomas, so this is the same formatter every machine runs.
      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      # Warnings are the standard here, not something to look at later.
      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Check formatting
        run: dotnet fantomas --check src tests

      # Every script is loaded straight from source and exits non-zero on the first failing
      # check; the runner starts them together, prints each one's whole output in the order
      # they are listed, and fails the job if any of them did.
      #
      # Together rather than one after another because nearly all of the time is `dotnet fsi`
      # compiling the same sources again for each script - twelve times over, on one core.
      # The list of which scripts there are lives in the runner and is still written out one
      # by one, so a script added without being listed shows up as a missing line in a review.
      - name: Checks
        run: pwsh tools/tests.ps1

      # A record is meant to replay for good. The committed one is the oldest thing in
      # the repository that still has to work, so the build says so out loud.
      - name: Replay the committed record
        run: |
          echo quit | dotnet run --no-build -- replay logs/2026-08-03-193909-2p-seed639214079490240407.log | head -2
